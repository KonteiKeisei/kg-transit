<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transit Icons Preview</title>
<link rel="stylesheet" href="../styles/transit.css">
<style>body { margin: 0; background: #2b2f33; }</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pixi.js/7.4.2/pixi.min.js"></script>
</head>
<body>
<!-- Draws the demo network's stations with the real StationLayer on a mocked canvas. ?size=40&zoom=0.2&theme=modern
     ?city=boston&era=1980s|modern&year=1986: a city network over its metro area, with its lines -->
<!-- Icon size defaults to 40 px; try size=10 for a dense city. &trace=1 curves the lines along KG Cities' track;
     &line=blue picks the line whose travel nodes can be edited; &focus=x,y,zoom looks closer. -->
<script type="module">
  const params = new URLSearchParams(location.search);
  const app = new PIXI.Application({ width: innerWidth, height: innerHeight, background: 0x2b2f33, antialias: true });
  document.body.append(app.view);
  const world = new PIXI.Container();
  world.scale.set(Number(params.get("zoom") ?? 0.18));
  app.stage.addChild(world);
  app.stage.eventMode = "static";
  app.stage.hitArea = app.screen;
  // Like Foundry's canvas stage, the world hears the pointer everywhere (for drags).
  world.eventMode = "static";
  world.hitArea = new PIXI.Rectangle(-1e6, -1e6, 2e6, 2e6);

  const { DEMO } = await import("/modules/kg-transit/scripts/demo-network.mjs");
  let network = DEMO;
  // ?city=new-york&era=modern: a city network over the whole metro, scaled to fit the window.
  const city = params.get("city");
  if (city) {
    const { cityNetwork } = await import("/modules/kg-transit/scripts/cities.mjs");
    const pack = await (await fetch(`/modules/kg-transit/data/cities/${city}.json`)).json();
    const rect = { x: 0, y: 0, width: 40000, height: Math.round(40000 * (pack.metro.miles[1] / pack.metro.miles[0])) };
    network = cityNetwork(pack, { city, era: params.get("era") ?? "modern", year: Number(params.get("year")) || (params.get("era") === "1980s" ? 1986 : 2026), extent: "metro" }, rect).net;
    world.scale.set((innerWidth || 800) / rect.width);
    // The real track from KG Cities, thin and pale under everything; the layer draws the lines
    // (curved along it with &trace=1) while editing.
    const info = { city, era: params.get("era") ?? "modern", year: 2026, extent: "metro" };
    const transit = await (await fetch(`/modules/kg-cities/data/transit/${city}.json`)).json().catch(() => null);
    const { sceneProjection } = await import("/modules/kg-transit/scripts/cities.mjs");
    const { project, pxPerMetre } = sceneProjection(pack, info, rect);
    if (transit) {
      const g = new PIXI.Graphics();
      g.lineStyle(14, 0xffffff, 0.35);
      for (const f of transit.features) f.geometry.coordinates.forEach(([lon, lat], i) => { const p = project(lat, lon); i ? g.lineTo(p.x, p.y) : g.moveTo(p.x, p.y); });
      world.addChild(g);
      if (params.get("trace")) {
        const { traceTracks } = await import("/modules/kg-transit/scripts/tracks.mjs");
        console.log("traced", traceTracks(network, transit, project, rect, pxPerMetre));
      }
    }
    // ?focus=x,y,zoom: look closer at one place.
    const focus = params.get("focus")?.split(",").map(Number);
    if (focus?.length === 3) {
      world.scale.set(focus[2]);
      world.position.set(innerWidth / 2 - focus[0] * focus[2], innerHeight / 2 - focus[1] * focus[2]);
    }
    window.network = network;
  }
  const scene = { getFlag: (_m, key) => (key === "enabled" ? true : key === "network" ? network : undefined) };
  globalThis.canvas = { scene, interface: world, stage: world, app };
  globalThis.game = { settings: { get: (_m, key) => ({ iconSize: Number(params.get("size") ?? 40), theme: params.get("theme") ?? "modern" })[key] }, user: { isGM: true } };
  globalThis.foundry = { utils: { Color: { from: (hex) => ({ valueOf: () => parseInt(String(hex).slice(1), 16) }) } } };

  const { StationLayer } = await import("/modules/kg-transit/scripts/station-layer.mjs");
  const layer = new StationLayer();
  layer.onBoard = (id) => console.log("board", id);
  layer.draw();
  if (city) {
    layer.setEditing(true);
    layer.selectLine(params.get("line") ?? network.lines[0]?.id);
    layer.onPath = (lineId, i, nodes) => console.log("path", lineId, i, nodes.length);
  }
  window.layer = layer;
</script>
</body>
</html>
